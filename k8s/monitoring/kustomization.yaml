apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: resumematch
resources:
  - prometheus.yaml
  - grafana.yaml
configMapGenerator:
  - name: grafana-dashboards
    files:
      - resumematch-dashboard.json   # copy of docker/grafana/provisioning/dashboards/resumematch.json
generatorOptions:
  disableNameSuffixHash: true
