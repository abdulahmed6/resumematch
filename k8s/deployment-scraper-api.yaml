# See deployment-embedding.yaml's header comment for the container-image
# caveat. Stateless control-plane API (trigger scrapes, list runs, DLQ
# inspect/replay -- see backend/scraper/service.py); safe to run >1 replica.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scraper-api
  namespace: resumematch
  labels:
    app: scraper-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: scraper-api
  template:
    metadata:
      labels:
        app: scraper-api
    spec:
      containers:
        - name: scraper-api
          image: ghcr.io/abdulahmed6/resumematch-backend:latest
          command: ["uvicorn", "backend.scraper.service:app", "--host", "0.0.0.0", "--port", "8002"]
          ports:
            - containerPort: 8002
          envFrom:
            - configMapRef:
                name: resumematch-config
            - secretRef:
                name: resumematch-secrets
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
