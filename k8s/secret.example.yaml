# Template only -- copy to secret.yaml, fill in real values, and DO NOT
# commit secret.yaml (it's gitignored). Holds the two settings that carry
# credentials: the Postgres DSN and the Redis URL.
#
# Pointing these at managed services (RDS/Cloud SQL for Postgres, ElastiCache
# / Upstash / Memorystore for Redis) is the realistic production setup; the
# in-cluster postgres.yaml / redis.yaml in this directory are dev/test
# conveniences for trying the manifests on kind/minikube, not a substitute
# for a managed, backed-up datastore in a real deployment.
apiVersion: v1
kind: Secret
metadata:
  name: resumematch-secrets
  namespace: resumematch
type: Opaque
stringData:
  RM_DATABASE_URL: "postgresql+psycopg2://resumematch:CHANGE_ME@postgres:5432/resumematch"
  RM_REDIS_URL: "redis://redis:6379/0"
