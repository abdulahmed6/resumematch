# Base manifests. The resumematch-secrets Secret is NOT included: apply your
# own (from secret.example.yaml) first, or use overlays/kind which generates
# one for the in-cluster Postgres/Redis.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: resumematch
resources:
  - namespace.yaml
  - configmap.yaml
  - postgres.yaml
  - redis.yaml
  - deployment-embedding.yaml
  - service-embedding.yaml
  - deployment-gateway.yaml
  - service-gateway.yaml
  - deployment-scraper-api.yaml
  - service-scraper-api.yaml
  - deployment-worker.yaml
  - deployment-beat.yaml
  - hpa-gateway.yaml
  - scaledobject-worker.yaml   # requires KEDA installed -- see that file's header
