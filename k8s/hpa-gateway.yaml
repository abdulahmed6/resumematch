# CPU-based HorizontalPodAutoscaler for the stateless query-path gateway.
# Requires metrics-server installed in the cluster (kind/minikube: enable the
# metrics-server addon or apply it manually -- it does not ship by default).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway
  namespace: resumematch
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
