apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: resumematch
spec:
  selector:
    app: gateway
  ports:
    - port: 8000
      targetPort: 8000
  # type: LoadBalancer (or an Ingress in front of this ClusterIP Service) if
  # you need external access; left as the ClusterIP default here since
  # that's cluster-agnostic.
