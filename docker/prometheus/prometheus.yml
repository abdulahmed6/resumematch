global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: ["gateway:8000"]

  - job_name: scraper-api
    static_configs:
      - targets: ["scraper-api:8002"]

  - job_name: embedding
    static_configs:
      - targets: ["embedding:8001"]
